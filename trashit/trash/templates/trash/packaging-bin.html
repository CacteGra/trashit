<table class="table table-striped table-hover">
  <thead class="table-dark">
    <tr>
      <th>Component</th>
      <th>Type</th>
    </tr>
  </thead>
  <tbody>
    {% if wrapper %}
      {% if packagings %}
        {% for packaging in packagings %}
          <tr>
            <td>{{ packaging.component|title }}</td>
            <td>{{ packaging.the_type.the_type|title }}</td>
          </tr>
        {% endfor %}
      {% else %}
        <tr>
          <td colspan="2" class="text-center text-muted">No Info On Packaging</td>
        </tr>
      {% endif %}
    {% else %}
      <tr>
        <td colspan="2" class="text-center text-muted">Unknown Product</td>
      </tr>
    {% endif %}
  </tbody>
</table>
